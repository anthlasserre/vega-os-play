name: vega-iptv

# Sur PR : vérification + build, pour ne jamais fusionner un paquet qui ne se
# construit pas. Sur tag `v*` : mêmes vérifications, puis publication des .vpkg
# en release GitHub.
on:
  pull_request:
    paths:
      - 'vega-iptv/**'
      - '.github/workflows/vega-iptv.yml'
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version à estampiller dans le paquet (sans le « v »)'
        required: false
        default: ''

# Dépôt public : le principe est qu'aucune étape ne dispose d'un droit qu'elle
# n'utilise pas. La construction ne lit que le code, seule la publication écrit.
permissions:
  contents: read

env:
  # Version du SDK épinglée : elle conditionne la clé de cache et garantit
  # qu'une release rejouée produit le même paquet. La faire évoluer invalide
  # naturellement le cache.
  VEGA_SDK_VERSION: '0.24.9914'

defaults:
  run:
    working-directory: vega-iptv

jobs:
  build:
    # Le SDK Vega ne supporte que macOS et Linux — pas de runner Windows ici.
    runs-on: ubuntu-latest
    # Aucune écriture. Ce job exécute le code de la PR, y compris celui d'un
    # fork : il ne doit rien pouvoir modifier dans le dépôt.
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: vega-iptv/package-lock.json

      - name: Restaurer le SDK Vega
        id: sdk-cache
        uses: actions/cache@v4
        with:
          path: ~/vega
          key: vega-sdk-${{ runner.os }}-${{ env.VEGA_SDK_VERSION }}

      - name: Installer le SDK Vega
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        working-directory: .
        run: |
          set -euo pipefail
          curl -fsSL https://sdk-installer.vega.labcollab.net/get_vvm.sh -o /tmp/get_vvm.sh
          NONINTERACTIVE=true bash /tmp/get_vvm.sh
          # Le device virtuel pèse 2,5 Go et ne sert pas à construire : l'écarter
          # ramène le cache de 6,2 Go à 3,8 Go.
          rm -rf "$HOME/vega/sdk/vega-sdk/main/${VEGA_SDK_VERSION}/vvd"

      - name: Exposer la CLI Vega
        working-directory: .
        run: echo "$HOME/vega/bin" >> "$GITHUB_PATH"

      - name: Version du SDK
        working-directory: .
        run: vega --version

      - run: npm ci

      # Le lecteur MSE Shaka n'est pas versionné : ses sources sont sous licence
      # Amazon et son dist compilé pèse 1,5 Mo. On le reconstruit — clonage de
      # shaka-player, patches Vega, Closure Compiler — et on met le résultat en
      # cache, la compilation prenant plusieurs minutes. Sans lui, `typecheck`
      # échoue : src/player/shaka/adapter.ts importe src/shakaplayer/.
      - name: Restaurer le lecteur Shaka
        id: shaka-cache
        uses: actions/cache@v4
        with:
          path: |
            vega-iptv/src/PlayerInterface.ts
            vega-iptv/src/polyfills
            vega-iptv/src/shakaplayer
          key: shaka-${{ runner.os }}-${{ hashFiles('vega-iptv/scripts/setup-shaka.sh') }}

      # Closure Compiler est compilé pour Java 21+ : le JDK par défaut du runner
      # ubuntu échoue sur un UnsupportedClassVersionError en fin de build.
      - uses: actions/setup-java@v4
        if: steps.shaka-cache.outputs.cache-hit != 'true'
        with:
          distribution: temurin
          java-version: '21'

      - name: Installer le lecteur Shaka
        if: steps.shaka-cache.outputs.cache-hit != 'true'
        run: npm run setup:shaka

      - run: npm run lint

      - run: npm run typecheck

      - run: npm test

      - name: Déterminer la version du paquet
        id: version
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          elif [ -n "${INPUT_VERSION:-}" ]; then
            VERSION="${INPUT_VERSION:-}"
          else
            # Build de vérification : version non publiable, tracée par le SHA.
            VERSION="0.0.0-${GITHUB_SHA:0:7}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Version du paquet : ${VERSION}"
        env:
          INPUT_VERSION: ${{ inputs.version }}

      - name: Construire les paquets Release
        run: |
          set -euo pipefail
          npx react-native build-vega \
            --build-type Release \
            --build-version "${{ steps.version.outputs.version }}" \
            --build-number "${GITHUB_RUN_NUMBER}"

      - name: Rassembler les artefacts
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          mkdir -p dist
          for pkg in build/*-release/*.vpkg; do
            arch="$(basename "$(dirname "${pkg}")")"
            arch="${arch%-release}"
            cp "${pkg}" "dist/vega-iptv-${VERSION}-${arch}.vpkg"
          done
          (cd dist && sha256sum ./*.vpkg > SHA256SUMS.txt)
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: vega-iptv-${{ steps.version.outputs.version }}
          path: vega-iptv/dist/
          if-no-files-found: error
          retention-days: 30

  # Job séparé pour que le droit d'écriture n'existe que sur un tag, et jamais
  # dans le job qui exécute le code d'une pull request.
  release:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: vega-iptv-${{ needs.build.outputs.version }}
          path: dist

      - name: Publier la release
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          # Les paquets viennent du job de build : on revérifie les empreintes
          # avant publication plutôt que de faire confiance au transfert.
          (cd dist && sha256sum -c SHA256SUMS.txt)
          {
            echo "Paquets Vega OS construits avec le SDK \`${VEGA_SDK_VERSION}\`, build \`${GITHUB_RUN_NUMBER}\`."
            echo
            echo "| Architecture | Cible |"
            echo "|---|---|"
            echo "| \`armv7\` / \`aarch64\` | Fire TV Stick 4K Select |"
            echo "| \`x86_64\` | Vega Virtual Device |"
            echo
            echo "Installation :"
            echo '```bash'
            echo "sha256sum -c SHA256SUMS.txt"
            echo "vega device install-app --packagePath vega-iptv-${VERSION}-aarch64.vpkg"
            echo "vega device launch-app --appName com.dkl.vegaiptv.main"
            echo '```'
          } > notes.md
          gh release create "${GITHUB_REF_NAME}" \
            --title "vega-iptv ${VERSION}" \
            --notes-file notes.md \
            dist/*.vpkg dist/SHA256SUMS.txt
