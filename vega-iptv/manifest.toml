schema-version = 1

[package]
title = "Vega IPTV"
version = "0.1.0"
id = "com.dkl.vegaiptv"

[os.version]
min = "1.2"
target = "1.2"

[needs]
[[needs.module]]
id = "/com.amazon.vega.os@IVega_1_2"

# Services média du lecteur W3C. Déclarés en [wants] : sans eux la lecture
# échoue silencieusement (aucun événement d'erreur), c'est le piège classique.

[[needs.module]]
id = "/com.amazon.kepler.kepler_media_controls_1@IKeplerMediaControls_0"

[[needs.module]]
id = "/com.amazon.kepler.keplermediadescriptor_1@IKeplermediadescriptor_1"

[[needs.module]]
id = "/com.amazon.kepler.keplerscript_4@IKeplerScript_0"

[[needs.module]]
id = "/com.amazon.kepler.w3cmedia_2@IW3cmedia_3"

[[needs.module]]
id = "/com.amazon.kepler.kepler_file_system_0@IKeplerFileSystem_0"





[wants]
[[wants.service]]
id = "com.amazon.media.server"

[[wants.service]]
id = "com.amazon.mediabuffer.service"

[[wants.service]]
id = "com.amazon.mediatransform.service"

[[wants.service]]
id = "com.amazon.mediametrics.service"

[[wants.service]]
id = "com.amazon.gipc.uuid.*"

[[wants.service]]
id = "com.amazon.audio.stream"

[[wants.service]]
id = "com.amazon.audio.control"

# Sans cette déclaration, les journaux de l'appareil répètent
# « Binder: Unable connect to 'com.amazon.audio.system'. Missing the permissions
# needed to connect to the service. » à chaque lecture.
[[wants.service]]
id = "com.amazon.audio.system"

# Clavier système. Un champ de saisie peut recevoir le focus D-PAD sans lui, mais
# aucun clavier n'apparaît : rien ne se saisit à la télécommande.
[[wants.service]]
id = "com.amazon.inputmethod.service"

[[wants.service]]
id = "com.amazon.inputmethod.client"

[[wants.privilege]]
id = "com.amazon.devconf.privilege.accessibility"

[offers]
[[offers.service]]
id = "com.amazon.gipc.uuid.*"

[components]
[[components.interactive]]
id = "com.dkl.vegaiptv.main"
runtime-module = "/com.amazon.kepler.runtime.react_native_kepler_4@IReactNativeKepler_0"
launch-type = "singleton"
categories = ["com.amazon.category.main"]
